<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Food Menu</title>

    <script>
        function orderPizza() {
            document.getElementById("pizza").innerHTML =
            "Pizza added to your order!";
        }

        function orderBurger() {
            document.getElementById("burger").innerHTML =
            "Burger added to your order!";
        }

        function orderPasta() {
            document.getElementById("pasta").innerHTML =
            "Pasta added to your order!";
        }

        function orderJuice() {
            document.getElementById("juice").innerHTML =
            "Juice added to your order!";
        }
    </script>

    <style>
        body{
            background-color:#f2f2f2;
            text-align:center;
            font-family:Arial;
        }

        h2{
            color:#333;
        }

        .card{
            background-color:white;
            border-radius:10px;
            width:200px;
            padding:15px;
            margin:15px;
            display:inline-block;
            box-shadow:0px 3px 8px gray;
        }

        button{
            background-color:#ff6600;
            color:white;
            border:none;
            padding:8px 15px;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background-color:#e65c00;
        }
    </style>

</head>

<body>

<h2>Restaurant Food Menu</h2>

<div class="card">
    <h3 style="color:#ff6600;">Pizza</h3>
    <p id="pizza">Click to order Pizza</p>
    <button onclick="orderPizza()">Order</button>
</div>

<div class="card">
    <h3 style="color:#ff6600;">Burger</h3>
    <p id="burger">Click to order Burger</p>
    <button onclick="orderBurger()">Order</button>
</div>

<div class="card">
    <h3 style="color:#ff6600;">Pasta</h3>
    <p id="pasta">Click to order Pasta</p>
    <button onclick="orderPasta()">Order</button>
</div>

<div class="card">
    <h3 style="color:#ff6600;">Juice</h3>
    <p id="juice">Click to order Juice</p>
    <button onclick="orderJuice()">Order</button>
</div>

</body>
</html>
